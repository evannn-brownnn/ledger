# Alembic configuration.
#
# Note there is no sqlalchemy.url here. migrations/env.py reads it from
# app.config instead, so there is exactly one source of truth for the
# connection string and no risk of migrating the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped, descriptive revision filenames. The default is a bare hash,
# which makes the versions directory unreadable once you have a dozen.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

timezone = UTC

[post_write_hooks]
# Format generated migrations so they match the rest of the codebase.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
