name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — saves minutes and gives you
# faster feedback on the commit you actually care about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check app tests
      - name: Ruff (format check)
        run: ruff format --check app tests
      - name: mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        # Without this, the job races the database and fails intermittently
        # — the classic flaky-CI cause.
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGER_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test
      LEDGER_TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test
      LEDGER_ENVIRONMENT: ci
      LEDGER_LOG_JSON: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Migrations reverse cleanly
        # A downgrade path you never exercise is a downgrade path that does
        # not work. Find out here, not during a rollback at 2am.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: ledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and reports healthy
        run: |
          docker run -d --name ledger-ci -p 8000:8000 \
            -e LEDGER_DATABASE_URL=postgresql+psycopg://x:x@localhost:5432/x \
            ledger:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live; then exit 0; fi
            sleep 1
          done
          echo "container never became live"; docker logs ledger-ci; exit 1
